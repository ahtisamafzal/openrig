name: Windows gate

# Roadmap 6.5 — the Windows release gate for the daemon. It runs the SAME documented local command
# (`npm run test:windows -w packages/daemon`), not a CI-only script. The set is the daemon suites
# verified green on Windows (gateway, human channels, secrets, notifications); it widens as the
# Phase 1 Windows backlog closes, and never runs funded providers or a real herdr.

on:
  pull_request:
  push:
    branches: [main, windows-herdr]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v4
      - uses: actions/setup-node@04be95cf3511ea51ebf9f224ddfb99cc7ab87cd4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build daemon
        run: npm run build -w packages/daemon
      - name: Windows test gate
        run: npm run test:windows -w packages/daemon
